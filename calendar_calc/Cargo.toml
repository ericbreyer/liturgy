[package]
name = "calendar_calc"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
toml = ">=0.9.5"
bitflags = { version = ">=2.0", features = ["serde"] }
anyhow = "*"
itertools = "0.14.0"
once_cell = "1.21.3"

[dev-dependencies]
test-case = "3.3"
insta = {version = "1.43", features = ["filters"]}
rayon = "1.11.0"
proptest = ">1.0.0"
pprof = { version = "0.15", features = ["flamegraph", "frame-pointer"] }
