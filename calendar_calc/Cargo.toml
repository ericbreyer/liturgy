[package]
name = "calendar_calc"
version = "0.1.0"
edition = "2024"
readme = "README.md"
homepage = "https://liturgy.ericbreyer.com"
repository = "https://github.com/ericbreyer/liturgy"
documentation = "https://docs.rs/calendar_calc"
keywords = ["liturgical", "calendar", "liturgy", "church"]
categories = ["science::astronomy", "development-tools::build-utils"]

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
toml = ">=0.9.5"
bitflags = { version = ">=2.0", features = ["serde"] }
anyhow = "*"
itertools = "0.14.0"
types = { path = "../types" }

[dev-dependencies]
test-case = "3.3"
insta = {version = "1.43", features = ["filters"]}
rayon = "1.11.0"
cross-proc-cache = { path = "../cross-proc-cache" }

[build-dependencies]
rand = "0.9"

[lints]
workspace = true
