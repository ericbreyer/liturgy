[workspace]
members = [
    "calendar_calc", 
    "cross-proc-cache", 
    "ordo", 
    "liturgy-backend", 
    "types"]
resolver = "3"

[workspace.lints.clippy]
all = {level = "deny", priority = -1}
pedantic = {level = "warn", priority = -1}
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"


[profile.bench]
debug = true