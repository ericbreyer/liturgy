<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Quia vidérunt óculi <b>me</b>i&nbsp;* salu<b>tá</b>re <b>tu</b>um,<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Quod pa<b>rás</b>ti&nbsp;* ante fáciem ómnium <b>po</b>pu<b>ló</b>rum,<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Lumen ad revelatiónem <b>Gén</b>tium,&nbsp;* et glóriam plebis <b>tu</b>æ <b>Is</b>raël.<br/>
