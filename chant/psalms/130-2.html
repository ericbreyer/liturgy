<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Neque ambulávi in <b>ma</b>gnis:&nbsp;* neque in mirabíli<i>bus</i> <b>su</b>per me.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Si non humíliter senti<b>é</b>bam:&nbsp;* sed exaltávi áni<i>mam</i> <b>me</b>am.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Sicut ablactátus est super matre <b>su</b>a:&nbsp;* ita retribútio in áni<i>ma</i> <b>me</b>a.<br/>
<span style='float:left;width:25pt;text-align:right;'>5.&nbsp;</span>Speret Israël in <b>Dó</b>mino:&nbsp;* ex hoc nunc et usque <i>in</i> <b>sǽ</b>culum.<br/>
