<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Neque ambulá<i>vi</i> <i>in</i> <b>ma</b>gnis:&nbsp;* neque in mira<i>bí</i><i>li</i><i>bus</i> <b>su</b><b>per</b> me.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Si non humíliter <i>sen</i><i>ti</i><b>é</b>bam:&nbsp;* sed exaltávi <i>á</i><i>ni</i><i>mam</i> <b>me</b>am.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Sicut ablactátus est super <i>ma</i><i>tre</i> <b>su</b>a:&nbsp;* ita retribútio in <i>á</i><i>ni</i><i>ma</i> <b>me</b>a.<br/>
<span style='float:left;width:25pt;text-align:right;'>5.&nbsp;</span>Speret Isra<i>ël</i> <i>in</i> <b>Dó</b>mino:&nbsp;* ex hoc nunc et <i>us</i><i>que</i> <i>in</i> <b>sǽ</b><b>cu</b>lum.<br/>
