<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Neque ambu<i>lá</i><i>vi</i> <i>in</i> <b>ma</b>gnis:&nbsp;* neque in mirabíli<i>bus</i> <b>su</b>per me.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Si non humíli<i>ter</i> <i>sen</i><i>ti</i><b>é</b>bam:&nbsp;* sed exaltávi áni<i>mam</i> <b>me</b>am.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Sicut ablactátus est su<i>per</i> <i>ma</i><i>tre</i> <b>su</b>a:&nbsp;* ita retribútio in áni<i>ma</i> <b>me</b>a.<br/>
<span style='float:left;width:25pt;text-align:right;'>5.&nbsp;</span>Speret Is<i>ra</i><i>ël</i> <i>in</i> <b>Dó</b>mino:&nbsp;* ex hoc nunc et usque <i>in</i> <b>sǽ</b>culum.<br/>
