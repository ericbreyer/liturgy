<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Sicut unguéntum in <b>cá</b>pite,&nbsp;* quod descéndit in barbam, bar<i>bam</i> <b>A</b>aron.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Quod descéndit in oram vestiménti <b>e</b>jus:&nbsp;* sicut ros Hermon, qui descéndit in mon<i>tem</i> <b>Si</b>on.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Quóniam illic mandávit Dóminus benedicti<b>ó</b>nem,&nbsp;* et vitam usque <i>in</i> <b>sǽ</b>culum.<br/>
