<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Sicut un<b>guén</b>tum in <b>cá</b><b>pi</b>te,&nbsp;* quod descéndit in bar<i>bam</i>, <i>bar</i><i>bam</i> <b>A</b>aron.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Quod descéndit in oram vesti<b>mén</b>ti <b>e</b>jus:&nbsp;* sicut ros Hermon, qui descéndit <i>in</i> <i>mon</i><i>tem</i> <b>Si</b>on.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Quóniam illic mandávit Dóminus bene<b>dic</b>ti<b>ó</b>nem,&nbsp;* et vitam <i>us</i><i>que</i> <i>in</i> <b>sǽ</b>culum.<br/>
