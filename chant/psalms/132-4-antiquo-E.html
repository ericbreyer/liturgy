<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Sicut unguén<i>tum</i> <i>in</i> <b>cá</b>pite,&nbsp;* quod descéndit in bar<i>bam</i>, <i>bar</i><i>bam</i> <b>A</b><b>a</b>ron.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>Quod descéndit in oram vesti<i>mén</i><i>ti</i> <b>e</b>jus:&nbsp;* sicut ros Hermon, qui descéndit <i>in</i> <i>mon</i><i>tem</i> <b>Si</b>on.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Quóniam illic mandávit Dóminus bene<i>dic</i><i>ti</i><b>ó</b>nem,&nbsp;* et vitam <i>us</i><i>que</i> <i>in</i> <b>sǽ</b><b>cu</b>lum.<br/>
