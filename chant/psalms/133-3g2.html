<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Qui statis in <b>do</b>mo <b>Dó</b><b>mi</b>ni,&nbsp;* in átriis do<i>mus</i> <i>De</i><i>i</i> <b>nos</b>tri.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>In nóctibus extóllite manus <b>ves</b>tras in <b>sanc</b>ta,&nbsp;* et bene<i>dí</i><i>ci</i><i>te</i> <b>Dó</b>minum.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Benedícat te Dómi<b>nus</b> ex <b>Si</b>on,&nbsp;* qui fecit <i>cæ</i><i>lum</i> <i>et</i> <b>ter</b>ram.<br/>
