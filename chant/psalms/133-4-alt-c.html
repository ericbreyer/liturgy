<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Qui statis in <i>do</i><i>mo</i> <b>Dó</b>mini,&nbsp;* in átriis domus Dei <b>nos</b>tri.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>In nóctibus extóllite manus ves<i>tras</i> <i>in</i> <b>sanc</b>ta,&nbsp;* et benedícite <b>Dó</b>minum.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Benedícat te Dómi<i>nus</i> <i>ex</i> <b>Si</b>on,&nbsp;* qui fecit cælum et <b>ter</b>ram.<br/>
