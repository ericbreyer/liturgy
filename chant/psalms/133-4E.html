<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Qui statis in <i>do</i><i>mo</i> <b>Dó</b>mini,&nbsp;* in átriis do<i>mus</i> <i>De</i><i>i</i> <b>nos</b>tri.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>In nóctibus extóllite manus ves<i>tras</i> <i>in</i> <b>sanc</b>ta,&nbsp;* et bene<i>dí</i><i>ci</i><i>te</i> <b>Dó</b><b>mi</b>num.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Benedícat te Dómi<i>nus</i> <i>ex</i> <b>Si</b>on,&nbsp;* qui fecit <i>cæ</i><i>lum</i> <i>et</i> <b>ter</b>ram.<br/>
