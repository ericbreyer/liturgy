<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Qui statis in do<i>mo</i> <b>Dó</b>mini,&nbsp;* in átriis domus <i>De</i><i>i</i> <b>nos</b>tri.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>In nóctibus extóllite manus vestras <i>in</i> <b>sanc</b>ta,&nbsp;* et benedí<i>ci</i><i>te</i> <b>Dó</b>minum.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Benedícat te Dóminus <i>ex</i> <b>Si</b>on,&nbsp;* qui fecit cæ<i>lum</i> <i>et</i> <b>ter</b>ram.<br/>
