<span style='float:left;width:25pt;text-align:right;'>2.&nbsp;</span>Qui statis <i>in</i> <i>do</i><i>mo</i> <b>Dó</b>mini,&nbsp;* in átriis domus De<i>i</i> <b>nos</b>tri.<br/>
<span style='float:left;width:25pt;text-align:right;'>3.&nbsp;</span>In nóctibus extóllite manus <i>ves</i><i>tras</i> <i>in</i> <b>sanc</b>ta,&nbsp;* et benedíci<i>te</i> <b>Dó</b>minum.<br/>
<span style='float:left;width:25pt;text-align:right;'>4.&nbsp;</span>Benedícat te Dó<i>mi</i><i>nus</i> <i>ex</i> <b>Si</b>on,&nbsp;* qui fecit cælum <i>et</i> <b>ter</b>ram.<br/>
