antiphons = [
  "When I am afraid I will trust in thee",
  "Create in me a clean heart, O God",
  "Turn us again, O Lord, and we shall be turned",
  "Have mercy upon us, O Lord",
  "Let us bless the Father, and the Son, and the Holy Spirit"
]
chapter = "O Lord, correct me; but with judgment"
hymn_title = "Forty Days and Forty Nights"
hymn_verses = [
  "Forty days and forty nights / Thou wast fasting in the wild"
]
[verse]
verse = "O God, thou art my God"
response = "My soul thirsteth for thee"
collect = "Almighty and everlasting God, who hatest nothing that thou hast made..."