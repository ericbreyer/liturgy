antiphons = [
  "Glory be to the Father, and to the Son, and to the Holy Ghost",
  "Blessed be the Holy Trinity, and undivided Unity",
  "Holy, holy, holy, Lord God of hosts",
  "O Lord our Governor, how excellent is thy name in all the world",
  "Let us bless the Father, and the Son, and the Holy Spirit"
]
chapter = "The grace of our Lord Jesus Christ, and the love of God, and the fellowship of the Holy Spirit"
hymn_title = "Holy, Holy, Holy"
hymn_verses = [
  "Holy, holy, holy! Lord God Almighty! / Early in the morning our song shall rise to Thee"
]
[verse]
verse = "Bless the Lord, O my soul"
response = "And all that is within me, bless his holy name"
collect = "Almighty and everlasting God, who hast given unto us thy servants grace..."