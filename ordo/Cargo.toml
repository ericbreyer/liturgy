[package]
name = "ordo"
version = "0.1.0"
edition = "2024"
readme = "README.md"
homepage = "https://liturgy.ericbreyer.com"
repository = "https://github.com/ericbreyer/liturgy"
documentation = "https://docs.rs/ordo"
keywords = ["liturgical", "liturgy", "calendar", "ordo"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
types = { path = "../types" }
calendar_calc = { path = "../calendar_calc" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
anyhow = "*"
nestify = "0.3.3"
rayon = "1.11.0"

[dev-dependencies]
test-case = "3.3"
insta = {version = "1.43", features = ["filters"]}

[lints]
workspace = true
